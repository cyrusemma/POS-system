      <main class="main-content">
        <div class="page-header">
          <div>
            <h1 class="page-title">Categories</h1>
            <p class="page-subtitle">Organise your products into categories.</p>
          </div>
          <div class="page-header-actions">
            <button
              class="theme-toggle"
              id="themeToggleBtn"
              title="Switch theme"
              aria-label="Switch theme"
            >
              <svg
                id="themeIcon"
                width="16"
                height="16"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
              </svg>
            </button>
            <button class="btn btn-primary" onclick="openAddModal()">
              <svg
                width="16"
                height="16"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M12 4v16m8-8H4"
                />
              </svg>
              Add Category
            </button>
          </div>
        </div>

        <div id="pageAlert" class="alert hidden"></div>

        <div class="card card-max-600">
          <div class="card-header">
            <span class="card-title">All Categories</span>
          </div>
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Products</th>
                  <th>Created</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="catsBody">
                <tr>
                  <td colspan="4" class="table-loading">Loading…</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>

    <!-- Add Modal -->
    <div class="modal-overlay" id="addModal">
      <div class="modal modal-sm">
        <div class="modal-header">
          <span class="modal-title">Add Category</span>
          <button class="modal-close" onclick="closeModal('addModal')" aria-label="Close">
            <svg
              width="14"
              height="14"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2.5"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <div id="addAlert" class="alert hidden"></div>
          <div class="form-group">
            <label class="form-label" for="addName">Category Name</label>
            <input
              type="text"
              id="addName"
              class="form-control"
              placeholder="e.g. Beverages"
            />
            <div class="form-error" id="addNameErr"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="closeModal('addModal')">
            Cancel
          </button>
          <button class="btn btn-primary" id="addBtn" onclick="addCategory()">
            Add Category
          </button>
        </div>
      </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="editModal">
      <div class="modal modal-sm">
        <div class="modal-header">
          <span class="modal-title">Edit Category</span>
          <button class="modal-close" onclick="closeModal('editModal')" aria-label="Close">
            <svg
              width="14"
              height="14"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2.5"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <div id="editAlert" class="alert hidden"></div>
          <input type="hidden" id="editId" />
          <div class="form-group">
            <label class="form-label" for="editName">Category Name</label>
            <input type="text" id="editName" class="form-control" />
            <div class="form-error" id="editNameErr"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="closeModal('editModal')">
            Cancel
          </button>
          <button class="btn btn-primary" id="editBtn" onclick="saveCategory()">
            Save
          </button>
        </div>
      </div>
    </div>

    <script>
      let currentUser = null;
      let allCats = [];

      window.addEventListener("DOMContentLoaded", async () => {
        initTheme();
        const _ttb = document.getElementById("themeToggleBtn");
        if (_ttb) _ttb.addEventListener("click", toggleTheme);
        currentUser = await requireAuth(["admin"]);
        if (!currentUser) return;
        populateSidebarUser(currentUser);
        loadCategories();
      });

      async function loadCategories() {
        document.getElementById("catsBody").innerHTML =
          '<tr><td colspan="4" class="table-loading">Loading…</td></tr>';
        const { data, error } = await db
          .from("categories")
          .select("*, products(id)")
          .order("name");
        if (error) {
          showAlert("pageAlert", "Error: " + error.message);
          return;
        }
        allCats = data || [];
        renderCategories(allCats);
      }

      function renderCategories(cats) {
        const body = document.getElementById("catsBody");
        if (!cats.length) {
          body.innerHTML =
            '<tr><td colspan="4" class="table-empty">No categories yet.</td></tr>';
          return;
        }
        body.innerHTML = cats
          .map(
            (c) => `
    <tr>
      <td><span class="fw-600">${escHtml(c.name)}</span></td>
      <td class="text-muted">${(c.products || []).length} products</td>
      <td class="text-muted">${formatDate(c.created_at)}</td>
      <td>
        <div class="action-btns">
          <button class="btn btn-sm btn-secondary" onclick="openEdit(${c.id})">Edit</button>
          <button class="btn btn-sm btn-danger" onclick="deleteCategory(${c.id},'${escHtml(c.name)}',${(c.products || []).length})">Delete</button>
        </div>
      </td>
    </tr>
  `,
          )
          .join("");
      }

      function openAddModal() {
        document.getElementById("addName").value = "";
        document.getElementById("addNameErr").textContent = "";
        hideAlert("addAlert");
        openModal("addModal");
      }

      async function addCategory() {
        hideAlert("addAlert");
        const name = document.getElementById("addName").value.trim();
        if (!name) {
          document.getElementById("addNameErr").textContent =
            "Name is required.";
          return;
        }
        const btn = document.getElementById("addBtn");
        btn.disabled = true;
        btn.textContent = "Adding…";
        try {
          const { error } = await db.from("categories").insert({ name });
          if (error) throw error;
          closeModal("addModal");
          showAlert("pageAlert", "Category added.", "success");
          loadCategories();
        } catch (err) {
          showAlert("addAlert", err.message);
        } finally {
          btn.disabled = false;
          btn.textContent = "Add Category";
        }
      }

      function openEdit(id) {
        const c = allCats.find((x) => x.id === id);
        if (!c) return;
        document.getElementById("editId").value = c.id;
        document.getElementById("editName").value = c.name;
        document.getElementById("editNameErr").textContent = "";
        hideAlert("editAlert");
        openModal("editModal");
      }

      async function saveCategory() {
        hideAlert("editAlert");
        const id = parseInt(document.getElementById("editId").value);
        const name = document.getElementById("editName").value.trim();
        if (!name) {
          document.getElementById("editNameErr").textContent =
            "Name is required.";
          return;
        }
        const btn = document.getElementById("editBtn");
        btn.disabled = true;
        btn.textContent = "Saving…";
        try {
          const { error } = await db
            .from("categories")
            .update({ name })
            .eq("id", id);
          if (error) throw error;
          closeModal("editModal");
          showAlert("pageAlert", "Category updated.", "success");
          loadCategories();
        } catch (err) {
          showAlert("editAlert", err.message);
        } finally {
          btn.disabled = false;
          btn.textContent = "Save";
        }
      }

      async function deleteCategory(id, name, prodCount) {
        if (prodCount > 0) {
          showAlert(
            "pageAlert",
            `Cannot delete "${name}" — it has ${prodCount} product(s). Reassign or delete products first.`,
            "warning",
          );
          return;
        }
        if (!confirm(`Delete category "${name}"?`)) return;
        const { error } = await db.from("categories").delete().eq("id", id);
        if (error) {
          showAlert("pageAlert", "Delete failed: " + error.message);
          return;
        }
        showAlert("pageAlert", "Category deleted.", "success");
        loadCategories();
      }

      function escHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
    </script>
  </body>
