          <div class="sidebar-user">
            <div class="user-name" id="sidebarUserName">Loading…</div>

              width="15"
              height="15"
              fill="none"

              stroke-width="2"
            >

                stroke-linecap="round"
                stroke-linejoin="round"
                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
              />

            Logout
          </button>

      <main class="main-content">
        <div class="page-header">
          <div>
            <h1 class="page-title">Suppliers</h1>
            <p class="page-subtitle">Manage your product suppliers.</p>
          </div>
          <div class="page-header-actions">
            <button
              class="theme-toggle"
              id="themeToggleBtn"
              title="Switch theme"
              aria-label="Toggle dark/light theme"
            >
              <svg
                id="themeIcon"
                width="16"
                height="16"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
              </svg>
            </button>
            <button
              class="btn btn-primary"
              onclick="openAddModal()"
              aria-label="Add new supplier"
            >
              <svg
                width="16"
                height="16"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M12 4v16m8-8H4"
                />
              </svg>
              Add Supplier
            </button>
          </div>
        </div>

        <div id="pageAlert" class="alert hidden mb-16"></div>

        <!-- Search -->
        <div class="table-toolbar">
          <div class="search-box">
            <svg
              width="15"
              height="15"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
              />
            </svg>
            <input
              type="text"
              id="searchInput"
              placeholder="Search suppliers…"
              oninput="filterSuppliers()"
            />
          </div>
        </div>

        <!-- Table -->
        <div class="table-card">
          <table class="data-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Company</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="suppliersBody">
              <tr>
                <td colspan="6" class="table-empty">Loading…</td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>

    <!-- Add Modal -->
    <div class="modal-overlay" id="addModal">
      <div class="modal">
        <div class="modal-header">
          <span class="modal-title">Add Supplier</span>
          <button
            class="modal-close"
            onclick="closeModal('addModal')"
            aria-label="Close modal"
          >
            <svg
              width="14"
              height="14"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2.5"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <div id="addAlert" class="alert hidden"></div>
          <div class="grid-2">
            <div class="form-group">
              <label class="form-label" for="addName">Supplier Name *</label>
              <input
                type="text"
                id="addName"
                class="form-control"
                placeholder="e.g. John Mensah"
              />
              <div class="form-error" id="addNameErr"></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="addCompany">Company</label>
              <input
                type="text"
                id="addCompany"
                class="form-control"
                placeholder="e.g. Mensah Distributors Ltd"
              />
            </div>
            <div class="form-group">
              <label class="form-label" for="addPhone">Phone</label>
              <input
                type="tel"
                id="addPhone"
                class="form-control"
                placeholder="e.g. 0241234567"
              />
            </div>
            <div class="form-group">
              <label class="form-label" for="addEmail">Email</label>
              <input
                type="email"
                id="addEmail"
                class="form-control"
                placeholder="e.g. john@mensah.com"
              />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="addAddress">Address</label>
            <input
              type="text"
              id="addAddress"
              class="form-control"
              placeholder="e.g. Accra, Ghana"
            />
          </div>
          <div class="form-group">
            <label class="form-label" for="addNotes">Notes</label>
            <textarea
              id="addNotes"
              class="form-control form-textarea-resize"
              rows="2"
              placeholder="Any notes about this supplier…"
            ></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="closeModal('addModal')">
            Cancel
          </button>
          <button class="btn btn-primary" id="addBtn" onclick="addSupplier()">
            Add Supplier
          </button>
        </div>
      </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="editModal">
      <div class="modal">
        <div class="modal-header">
          <span class="modal-title">Edit Supplier</span>
          <button
            class="modal-close"
            onclick="closeModal('editModal')"
            aria-label="Close modal"
          >
            <svg
              width="14"
              height="14"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2.5"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <div id="editAlert" class="alert hidden"></div>
          <input type="hidden" id="editId" />
          <div class="grid-2">
            <div class="form-group">
              <label class="form-label" for="editName">Supplier Name *</label>
              <input type="text" id="editName" class="form-control" />
              <div class="form-error" id="editNameErr"></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="editCompany">Company</label>
              <input type="text" id="editCompany" class="form-control" />
            </div>
            <div class="form-group">
              <label class="form-label" for="editPhone">Phone</label>
              <input type="tel" id="editPhone" class="form-control" />
            </div>
            <div class="form-group">
              <label class="form-label" for="editEmail">Email</label>
              <input type="email" id="editEmail" class="form-control" />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="editAddress">Address</label>
            <input type="text" id="editAddress" class="form-control" />
          </div>
          <div class="form-group">
            <label class="form-label" for="editNotes">Notes</label>
            <textarea
              id="editNotes"
              class="form-control form-textarea-resize"
              rows="2"
            ></textarea>
          </div>
          <div class="form-group">
            <label class="form-label" for="editStatus">Status</label>
            <select id="editStatus" class="form-control">
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="closeModal('editModal')">
            Cancel
          </button>
          <button class="btn btn-primary" id="editBtn" onclick="saveSupplier()">
            Save Changes
          </button>
        </div>
      </div>
    </div>

    <script>
      let currentUser = null;
      let allSuppliers = [];

      window.addEventListener("DOMContentLoaded", async () => {
        initTheme();
        document
          .getElementById("themeToggleBtn")
          .addEventListener("click", toggleTheme);
        currentUser = await requireAuth(["admin"]);
        if (!currentUser) return;
        populateSidebarUser(currentUser);
        await loadSuppliers();
      });

      async function loadSuppliers() {
        const { data, error } = await db
          .from("suppliers")
          .select("*")
          .order("name");
        if (error) {
          showAlert("pageAlert", "Failed to load suppliers: " + error.message);
          return;
        }
        allSuppliers = data || [];
        renderSuppliers(allSuppliers);
      }

      function filterSuppliers() {
        const q = document.getElementById("searchInput").value.toLowerCase();
        renderSuppliers(
          allSuppliers.filter(
            (s) =>
              (s.name || "").toLowerCase().includes(q) ||
              (s.company || "").toLowerCase().includes(q) ||
              (s.phone || "").toLowerCase().includes(q) ||
              (s.email || "").toLowerCase().includes(q),
          ),
        );
      }

      function renderSuppliers(list) {
        const body = document.getElementById("suppliersBody");
        if (!list.length) {
          body.innerHTML =
            '<tr><td colspan="6" class="table-empty">No suppliers found.</td></tr>';
          return;
        }
        body.innerHTML = list
          .map(
            (s) => `
          <tr>
            <td><span class="fw-600">${escHtml(s.name)}</span>${s.notes ? '<div class="text-muted text-11px mt-2">' + escHtml(s.notes.substring(0, 60)) + (s.notes.length > 60 ? "…" : "") + "</div>" : ""}</td>
            <td class="text-muted">${escHtml(s.company || "—")}</td>
            <td>${escHtml(s.phone || "—")}</td>
            <td class="text-muted">${escHtml(s.email || "—")}</td>
            <td><span class="badge badge-${s.status}">${s.status}</span></td>
            <td>
              <div class="action-btns">
                <button class="btn btn-sm btn-secondary" onclick="openEdit(${s.id})" aria-label="Edit supplier">Edit</button>
                <button class="btn btn-sm btn-danger" onclick="confirmDelete(${s.id},'${escHtml(s.name)}')" aria-label="Delete supplier">Delete</button>
              </div>
            </td>
          </tr>
        `,
          )
          .join("");
      }

      function openAddModal() {
        hideAlert("addAlert");
        document.getElementById("addName").value = "";
        document.getElementById("addCompany").value = "";
        document.getElementById("addPhone").value = "";
        document.getElementById("addEmail").value = "";
        document.getElementById("addAddress").value = "";
        document.getElementById("addNotes").value = "";
        document.getElementById("addNameErr").textContent = "";
        openModal("addModal");
        setTimeout(() => document.getElementById("addName").focus(), 100);
      }

      async function addSupplier() {
        hideAlert("addAlert");
        const name = document.getElementById("addName").value.trim();
        document.getElementById("addNameErr").textContent = "";
        if (!name) {
          document.getElementById("addNameErr").textContent = "Required.";
          return;
        }

        const btn = document.getElementById("addBtn");
        btn.disabled = true;
        btn.textContent = "Adding…";
        try {
          const { error } = await db.from("suppliers").insert({
            name,
            company: document.getElementById("addCompany").value.trim() || null,
            phone: document.getElementById("addPhone").value.trim() || null,
            email: document.getElementById("addEmail").value.trim() || null,
            address: document.getElementById("addAddress").value.trim() || null,
            notes: document.getElementById("addNotes").value.trim() || null,
          });
          if (error) throw error;
          closeModal("addModal");
          showAlert("pageAlert", "Supplier added successfully.", "success");
          await loadSuppliers();
        } catch (err) {
          showAlert("addAlert", err.message);
        } finally {
          btn.disabled = false;
          btn.textContent = "Add Supplier";
        }
      }

      function openEdit(id) {
        const s = allSuppliers.find((x) => x.id === id);
        if (!s) return;
        hideAlert("editAlert");
        document.getElementById("editId").value = s.id;
        document.getElementById("editName").value = s.name || "";
        document.getElementById("editCompany").value = s.company || "";
        document.getElementById("editPhone").value = s.phone || "";
        document.getElementById("editEmail").value = s.email || "";
        document.getElementById("editAddress").value = s.address || "";
        document.getElementById("editNotes").value = s.notes || "";
        document.getElementById("editStatus").value = s.status || "active";
        document.getElementById("editNameErr").textContent = "";
        openModal("editModal");
      }

      async function saveSupplier() {
        hideAlert("editAlert");
        const id = parseInt(document.getElementById("editId").value);
        const name = document.getElementById("editName").value.trim();
        document.getElementById("editNameErr").textContent = "";
        if (!name) {
          document.getElementById("editNameErr").textContent = "Required.";
          return;
        }

        const btn = document.getElementById("editBtn");
        btn.disabled = true;
        btn.textContent = "Saving…";
        try {
          const { error } = await db
            .from("suppliers")
            .update({
              name,
              company:
                document.getElementById("editCompany").value.trim() || null,
              phone: document.getElementById("editPhone").value.trim() || null,
              email: document.getElementById("editEmail").value.trim() || null,
              address:
                document.getElementById("editAddress").value.trim() || null,
              notes: document.getElementById("editNotes").value.trim() || null,
              status: document.getElementById("editStatus").value,
            })
            .eq("id", id);
          if (error) throw error;
          closeModal("editModal");
          showAlert("pageAlert", "Supplier updated.", "success");
          await loadSuppliers();
        } catch (err) {
          showAlert("editAlert", err.message);
        } finally {
          btn.disabled = false;
          btn.textContent = "Save Changes";
        }
      }

      async function confirmDelete(id, name) {
        if (!confirm('Delete supplier "' + name + '"? This cannot be undone.'))
          return;
        // Check if supplier has products
        const { data: products } = await db
          .from("products")
          .select("id")
          .eq("supplier_id", id)
          .limit(1);
        if (products && products.length > 0) {
          showAlert(
            "pageAlert",
            "Cannot delete — this supplier has products linked to them. Remove the supplier from those products first.",
          );
          return;
        }
        const { error } = await db.from("suppliers").delete().eq("id", id);
        if (error) {
          showAlert("pageAlert", error.message);
          return;
        }
        showAlert("pageAlert", "Supplier deleted.", "success");
        await loadSuppliers();
      }

      function escHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
    </script>
  </body>
</html>
