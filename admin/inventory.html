          <div class="sidebar-user">
            <div class="user-name" id="sidebarUserName">Loading…</div>
            <div class="user-role" id="sidebarUserRole"></div>
          </div>
          <button class="logout-btn" onclick="logout()">
            <svg
              width="15"
              height="15"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
              /></svg
            >Logout
          </button>

      <main class="main-content">
        <div class="page-header">
          <div>
            <h1 class="page-title">Inventory</h1>
            <p class="page-subtitle">Monitor and manage stock levels.</p>
          </div>
          <button class="theme-toggle" id="themeToggleBtn" title="Switch theme" aria-label="Switch theme">
            <svg
              id="themeIcon"
              width="16"
              height="16"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
          </button>
        </div>

        <div id="pageAlert" class="alert hidden"></div>

        <div class="card">
          <div class="card-header">
            <span class="card-title">Stock Levels</span>
            <div class="search-box search-box-wide">
              <svg
                width="15"
                height="15"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                />
              </svg>
              <input
                type="text"
                id="searchInput"
                placeholder="Search products…"
                oninput="filterProducts()"
                aria-label="Search products"
              />
            </div>
          </div>
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Product</th>
                  <th>Category</th>
                  <th>Stock</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="inventoryBody">
                <tr>
                  <td colspan="5" class="table-loading">Loading…</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>

    <!-- Restock Modal -->
    <div class="modal-overlay" id="restockModal">
      <div class="modal modal-md">
        <div class="modal-header">
          <span class="modal-title">Restock Product</span>
          <button class="modal-close" onclick="closeModal('restockModal')" aria-label="Close">
            <svg
              width="14"
              height="14"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2.5"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <div id="restockAlert" class="alert hidden"></div>
          <input type="hidden" id="restockProductId" />
          <p
            class="modal-product-name mb-16"
            id="restockProductName"
          ></p>
          <div class="form-group">
            <label class="form-label" for="restockQty">Quantity to Add</label>
            <input
              type="number"
              id="restockQty"
              class="form-control"
              placeholder="e.g. 50"
              min="1"
            />
            <div class="form-error" id="restockQtyErr"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="restockNote">Note (optional)</label>
            <input
              type="text"
              id="restockNote"
              class="form-control"
              placeholder="e.g. Supplier delivery"
            />
          </div>
        </div>
        <div class="modal-footer">
          <button
            class="btn btn-secondary"
            onclick="closeModal('restockModal')"
          >
            Cancel
          </button>
          <button class="btn btn-primary" id="restockBtn" onclick="doRestock()">
            Restock
          </button>
        </div>
      </div>
    </div>

    <!-- Adjust Modal -->
    <div class="modal-overlay" id="adjustModal">
      <div class="modal modal-md">
        <div class="modal-header">
          <span class="modal-title">Adjust Stock</span>
          <button class="modal-close" onclick="closeModal('adjustModal')" aria-label="Close">
            <svg
              width="14"
              height="14"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2.5"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <div id="adjustAlert" class="alert hidden"></div>
          <input type="hidden" id="adjustProductId" />
          <input type="hidden" id="adjustCurrentStock" />
          <p
            id="adjustProductName"
            class="modal-product-name mb-16"
          ></p>
          <div class="form-group">
            <label class="form-label" for="adjustQty">New Exact Stock Quantity</label>
            <input
              type="number"
              id="adjustQty"
              class="form-control"
              placeholder="Enter new quantity"
              min="0"
            />
            <div class="form-error" id="adjustQtyErr"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="adjustReason">Reason</label>
            <input
              type="text"
              id="adjustReason"
              class="form-control"
              placeholder="e.g. Stocktake correction"
            />
            <div class="form-error" id="adjustReasonErr"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="closeModal('adjustModal')">
            Cancel
          </button>
          <button class="btn btn-primary" id="adjustBtn" onclick="doAdjust()">
            Apply Adjustment
          </button>
        </div>
      </div>
    </div>

    <script>
      let currentUser = null;
      let allProducts = [];

      window.addEventListener("DOMContentLoaded", async () => {
        initTheme();
        const _ttb = document.getElementById("themeToggleBtn");
        if (_ttb) _ttb.addEventListener("click", toggleTheme);
        currentUser = await requireAuth(["admin"]);
        if (!currentUser) return;
        populateSidebarUser(currentUser);
        loadInventory();
      });

      async function loadInventory() {
        document.getElementById("inventoryBody").innerHTML =
          '<tr><td colspan="5" class="table-loading">Loading…</td></tr>';
        const { data, error } = await db
          .from("products")
          .select("*, categories(name)")
          .order("name");
        if (error) {
          showAlert("pageAlert", "Error: " + error.message);
          return;
        }
        allProducts = data || [];
        renderInventory(allProducts);
      }

      function renderInventory(list) {
        const body = document.getElementById("inventoryBody");
        if (!list.length) {
          body.innerHTML =
            '<tr><td colspan="5" class="table-empty">No products found.</td></tr>';
          return;
        }
        body.innerHTML = list
          .map(
            (p) => `
    <tr class="${p.stock < 10 ? "low-stock" : ""}">
      <td><span class="fw-600">${escHtml(p.name)}</span></td>
      <td class="text-muted">${escHtml(p.categories?.name || "—")}</td>
      <td>
        <span class="fw-600 stock-value">${p.stock}</span>
        ${p.stock < 10 ? '<span class="badge badge-low ml-6">Low</span>' : ""}
        ${p.stock === 0 ? '<span class="badge badge-inactive ml-4">Out</span>' : ""}
      </td>
      <td><span class="badge badge-${p.status}">${p.status}</span></td>
      <td>
        <div class="action-btns">
          <button class="btn btn-sm btn-success" onclick="openRestock(${p.id})">Restock</button>
          <button class="btn btn-sm btn-secondary" onclick="openAdjust(${p.id})">Adjust</button>
        </div>
      </td>
    </tr>
  `,
          )
          .join("");
      }

      function filterProducts() {
        const q = document.getElementById("searchInput").value.toLowerCase();
        renderInventory(
          allProducts.filter((p) => (p.name || "").toLowerCase().includes(q)),
        );
      }

      function openRestock(id) {
        const p = allProducts.find((x) => x.id === id);
        if (!p) return;
        document.getElementById("restockProductId").value = p.id;
        document.getElementById("restockProductName").textContent =
          p.name + " — Current stock: " + p.stock;
        document.getElementById("restockQty").value = "";
        document.getElementById("restockNote").value = "";
        document.getElementById("restockQtyErr").textContent = "";
        hideAlert("restockAlert");
        openModal("restockModal");
      }

      async function doRestock() {
        hideAlert("restockAlert");
        const id = parseInt(document.getElementById("restockProductId").value);
        const qty = parseInt(document.getElementById("restockQty").value);
        const note = document.getElementById("restockNote").value.trim();
        if (!qty || qty < 1) {
          document.getElementById("restockQtyErr").textContent =
            "Enter a valid quantity (≥ 1).";
          return;
        }

        const btn = document.getElementById("restockBtn");
        btn.disabled = true;
        btn.textContent = "Saving…";

        try {
          const prod = allProducts.find((x) => x.id === id);
          const newStock = (prod?.stock || 0) + qty;
          const { error: upErr } = await db
            .from("products")
            .update({ stock: newStock })
            .eq("id", id);
          if (upErr) throw upErr;
          const { error: logErr } = await db.from("inventory_log").insert({
            product_id: id,
            change_type: "restock",
            quantity_change: qty,
            note: note || "Restock",
            created_by: currentUser.id,
          });
          if (logErr) console.warn("Log insert failed:", logErr.message);
          closeModal("restockModal");
          showAlert("pageAlert", "Restock recorded successfully.", "success");
          loadInventory();
        } catch (err) {
          showAlert("restockAlert", err.message);
        } finally {
          btn.disabled = false;
          btn.textContent = "Restock";
        }
      }

      function openAdjust(id) {
        const p = allProducts.find((x) => x.id === id);
        if (!p) return;
        document.getElementById("adjustProductId").value = p.id;
        document.getElementById("adjustCurrentStock").value = p.stock;
        document.getElementById("adjustProductName").textContent =
          p.name + " — Current stock: " + p.stock;
        document.getElementById("adjustQty").value = p.stock;
        document.getElementById("adjustReason").value = "";
        ["adjustQtyErr", "adjustReasonErr"].forEach(
          (id) => (document.getElementById(id).textContent = ""),
        );
        hideAlert("adjustAlert");
        openModal("adjustModal");
      }

      async function doAdjust() {
        hideAlert("adjustAlert");
        const id = parseInt(document.getElementById("adjustProductId").value);
        const oldQty = parseInt(
          document.getElementById("adjustCurrentStock").value,
        );
        const newQty = parseInt(document.getElementById("adjustQty").value);
        const reason = document.getElementById("adjustReason").value.trim();
        let valid = true;
        if (isNaN(newQty) || newQty < 0) {
          document.getElementById("adjustQtyErr").textContent =
            "Enter a valid quantity.";
          valid = false;
        }
        if (!reason) {
          document.getElementById("adjustReasonErr").textContent =
            "Reason is required.";
          valid = false;
        }
        if (!valid) return;

        const btn = document.getElementById("adjustBtn");
        btn.disabled = true;
        btn.textContent = "Saving…";

        try {
          const { error: upErr } = await db
            .from("products")
            .update({ stock: newQty })
            .eq("id", id);
          if (upErr) throw upErr;
          const diff = newQty - oldQty;
          const { error: logErr } = await db.from("inventory_log").insert({
            product_id: id,
            change_type: "adjustment",
            quantity_change: diff,
            note: reason,
            created_by: currentUser.id,
          });
          if (logErr) console.warn("Log insert failed:", logErr.message);
          closeModal("adjustModal");
          showAlert("pageAlert", "Stock adjusted successfully.", "success");
          loadInventory();
        } catch (err) {
          showAlert("adjustAlert", err.message);
        } finally {
          btn.disabled = false;
          btn.textContent = "Apply Adjustment";
        }
      }

      function escHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
    </script>
  </body>
</html>
