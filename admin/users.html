      <!-- Main Content -->
      <main class="main-content">
        <div class="page-header">
          <div>
            <h1 class="page-title">Users</h1>
            <p class="page-subtitle">Manage system users and their roles.</p>
          </div>
          <div class="page-header-actions">
            <button
              class="theme-toggle"
              id="themeToggleBtn"
              title="Switch theme"
            >
              <svg
                id="themeIcon"
                width="16"
                height="16"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
              </svg>
            </button>
            <button class="btn btn-primary" onclick="openAddUserModal()">
              <svg
                width="16"
                height="16"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M12 4v16m8-8H4"
                />
              </svg>
              Add User
            </button>
          </div>
        </div>

        <div id="pageAlert" class="alert hidden"></div>

        <div class="card">
          <div class="card-header">
            <span class="card-title">All Users</span>
            <div class="search-box search-box-narrow">
              <svg
                width="15"
                height="15"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                />
              </svg>
              <input
                type="text"
                id="searchInput"
                placeholder="Search users…"
                oninput="filterUsers()"
              />
            </div>
          </div>
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Role</th>
                  <th>Status</th>
                  <th>Joined</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="usersBody">
                <tr>
                  <td colspan="6" class="table-loading">Loading…</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>

    <!-- Add User Modal -->
    <div class="modal-overlay" id="addUserModal">
      <div class="modal">
        <div class="modal-header">
          <span class="modal-title">Add New User</span>
          <button
            class="modal-close"
            onclick="closeModal('addUserModal')"
            title="Close modal"
          >
            <svg
              width="14"
              height="14"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2.5"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <div id="addAlert" class="alert hidden"></div>
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input
              type="text"
              id="addName"
              class="form-control"
              placeholder="John Doe"
            />
            <div class="form-error" id="addNameErr"></div>
          </div>
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input
              type="email"
              id="addEmail"
              class="form-control"
              placeholder="user@example.com"
            />
            <div class="form-error" id="addEmailErr"></div>
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input
              type="password"
              id="addPassword"
              class="form-control"
              placeholder="Min. 6 characters"
            />
            <div class="form-error" id="addPasswordErr"></div>
          </div>
          <div class="form-group">
            <label class="form-label">Role</label>
            <select
              id="addRole"
              class="form-control"
              title="User Role - Select role for this user"
            >
              <option value="cashier">Cashier</option>
              <option value="manager">Manager</option>
              <option value="admin">Admin</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button
            class="btn btn-secondary"
            onclick="closeModal('addUserModal')"
          >
            Cancel
          </button>
          <button class="btn btn-primary" id="addUserBtn" onclick="addUser()">
            Create User
          </button>
        </div>
      </div>
    </div>

    <!-- Edit User Modal -->
    <div class="modal-overlay" id="editUserModal">
      <div class="modal">
        <div class="modal-header">
          <span class="modal-title">Edit User</span>
          <button
            class="modal-close"
            onclick="closeModal('editUserModal')"
            title="Close modal"
          >
            <svg
              width="14"
              height="14"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2.5"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <div id="editAlert" class="alert hidden"></div>
          <input type="hidden" id="editUserId" />
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input
              type="text"
              id="editName"
              class="form-control"
              placeholder="Full name"
            />
            <div class="form-error" id="editNameErr"></div>
          </div>
          <div class="form-group">
            <label class="form-label">Role</label>
            <select
              id="editRole"
              class="form-control"
              title="User Role - Select role for this user"
            >
              <option value="cashier">Cashier</option>
              <option value="manager">Manager</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Status</label>
            <select
              id="editStatus"
              class="form-control"
              title="User Status - Select active or inactive"
            >
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button
            class="btn btn-secondary"
            onclick="closeModal('editUserModal')"
          >
            Cancel
          </button>
          <button
            class="btn btn-primary"
            id="editUserBtn"
            onclick="saveEditUser()"
          >
            Save Changes
          </button>
        </div>
      </div>
    </div>

    <script>
      let currentUser = null;
      let allUsers = [];

      window.addEventListener("DOMContentLoaded", async () => {
        initTheme();
        const _ttb = document.getElementById("themeToggleBtn");
        if (_ttb) _ttb.addEventListener("click", toggleTheme);
        currentUser = await requireAuth(["admin"]);
        if (!currentUser) return;
        populateSidebarUser(currentUser);
        loadUsers();
      });

      async function loadUsers() {
        document.getElementById("usersBody").innerHTML =
          '<tr><td colspan="6" class="table-loading">Loading…</td></tr>';
        const { data, error } = await db
          .from("profiles")
          .select("*")
          .order("created_at", { ascending: false });
        if (error) {
          showAlert("pageAlert", "Failed to load users: " + error.message);
          document.getElementById("usersBody").innerHTML =
            '<tr><td colspan="6" class="table-empty">Error loading users.</td></tr>';
          return;
        }
        allUsers = data || [];
        renderUsers(allUsers);
      }

      function renderUsers(users) {
        const body = document.getElementById("usersBody");
        if (!users.length) {
          body.innerHTML =
            '<tr><td colspan="6" class="table-empty">No users found.</td></tr>';
          return;
        }
        body.innerHTML = users
          .map(
            (u) => `
    <tr>
      <td><span class="fw-600">${escHtml(u.name || "—")}</span></td>
      <td class="text-muted">${escHtml(u.email || "—")}</td>
      <td><span class="badge badge-${u.role}">${u.role}</span></td>
      <td><span class="badge badge-${u.status}">${u.status}</span></td>
      <td class="text-muted">${formatDate(u.created_at)}</td>
      <td>
        <div class="action-btns">
          <button class="btn btn-sm btn-secondary" onclick="openEditUser('${u.id}')">Edit</button>
          <button class="btn btn-sm btn-danger" onclick="confirmDeleteUser('${u.id}', '${escHtml(u.name || u.email)}')" ${u.role === "admin" ? "disabled" : ""} title="${u.role === "admin" ? "Cannot delete admin users" : "Delete user"}">Delete</button>
        </div>
      </td>
    </tr>
  `,
          )
          .join("");
      }

      function filterUsers() {
        const q = document.getElementById("searchInput").value.toLowerCase();
        const filtered = allUsers.filter(
          (u) =>
            (u.name || "").toLowerCase().includes(q) ||
            (u.email || "").toLowerCase().includes(q) ||
            (u.role || "").toLowerCase().includes(q),
        );
        renderUsers(filtered);
      }

      function openAddUserModal() {
        document.getElementById("addName").value = "";
        document.getElementById("addEmail").value = "";
        document.getElementById("addPassword").value = "";
        document.getElementById("addRole").value = "cashier";
        hideAlert("addAlert");
        ["addNameErr", "addEmailErr", "addPasswordErr"].forEach(
          (id) => (document.getElementById(id).textContent = ""),
        );
        openModal("addUserModal");
      }

      async function addUser() {
        hideAlert("addAlert");
        const name = document.getElementById("addName").value.trim();
        const email = document.getElementById("addEmail").value.trim();
        const password = document.getElementById("addPassword").value;
        const role = document.getElementById("addRole").value;
        let valid = true;

        if (!name) {
          document.getElementById("addNameErr").textContent =
            "Name is required.";
          valid = false;
        }
        if (!email) {
          document.getElementById("addEmailErr").textContent =
            "Email is required.";
          valid = false;
        }
        if (!password || password.length < 6) {
          document.getElementById("addPasswordErr").textContent =
            "Password must be at least 6 characters.";
          valid = false;
        }
        if (!valid) return;

        const btn = document.getElementById("addUserBtn");
        btn.disabled = true;
        btn.textContent = "Creating…";

        try {
          // Create auth user
          const { data, error } = await db.auth.admin.createUser({
            email,
            password,
            email_confirm: true,
            user_metadata: { name, role },
          });

          if (error) throw error;

          // Upsert profile (trigger may have already created it)
          await db.from("profiles").upsert({
            id: data.user.id,
            name,
            email,
            role,
            status: "active",
          });

          closeModal("addUserModal");
          showAlert("pageAlert", "User created successfully.", "success");
          loadUsers();
        } catch (err) {
          showAlert("addAlert", err.message || "Failed to create user.");
        } finally {
          btn.disabled = false;
          btn.textContent = "Create User";
        }
      }

      function openEditUser(userId) {
        const u = allUsers.find((x) => x.id === userId);
        if (!u) return;
        document.getElementById("editUserId").value = u.id;
        document.getElementById("editName").value = u.name || "";
        document.getElementById("editRole").value = u.role || "cashier";
        document.getElementById("editStatus").value = u.status || "active";
        document.getElementById("editNameErr").textContent = "";
        hideAlert("editAlert");
        openModal("editUserModal");
      }

      function confirmDeleteUser(userId, userName) {
        const confirmed = confirm(
          `Are you sure you want to delete ${userName}? This action cannot be undone.`,
        );
        if (confirmed) deleteUser(userId);
      }

      async function deleteUser(userId) {
        try {
          const { error } = await db.from("profiles").delete().eq("id", userId);
          if (error) throw error;
          showAlert("pageAlert", "User deleted successfully.", "success");
          loadUsers();
        } catch (err) {
          showAlert(
            "pageAlert",
            err.message || "Failed to delete user.",
            "danger",
          );
        }
      }

      async function saveEditUser() {
        hideAlert("editAlert");
        const id = document.getElementById("editUserId").value;
        const name = document.getElementById("editName").value.trim();
        const role = document.getElementById("editRole").value;
        const status = document.getElementById("editStatus").value;

        if (!name) {
          document.getElementById("editNameErr").textContent =
            "Name is required.";
          return;
        }

        // Guard: cannot deactivate the last admin
        if (status === "inactive" || role !== "admin") {
          const admins = allUsers.filter(
            (u) => u.role === "admin" && u.status === "active",
          );
          if (
            admins.length === 1 &&
            admins[0].id === id &&
            (role !== "admin" || status === "inactive")
          ) {
            showAlert("editAlert", "Cannot remove the last active admin.");
            return;
          }
        }

        const btn = document.getElementById("editUserBtn");
        btn.disabled = true;
        btn.textContent = "Saving…";

        try {
          const { error } = await db
            .from("profiles")
            .update({ name, role, status })
            .eq("id", id);
          if (error) throw error;
          closeModal("editUserModal");
          showAlert("pageAlert", "User updated successfully.", "success");
          loadUsers();
        } catch (err) {
          showAlert("editAlert", err.message || "Failed to update user.");
        } finally {
          btn.disabled = false;
          btn.textContent = "Save Changes";
        }
      }

      function escHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
    </script>
  </body>
