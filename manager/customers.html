<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customers — Manager</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>
    <script defer src="../config/supabase.js"></script>
    <script defer src="../assets/js/auth.js"></script>
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <div class="sidebar-logo">
          <div class="brand">
            <div class="brand-icon">
              <svg
                width="20"
                height="20"
                fill="none"
                viewBox="0 0 24 24"
                stroke="white"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"
                />
              </svg>
            </div>
            <div>
              <div class="brand-name">MY STORE</div>
              <div class="brand-sub">POS System</div>
            </div>
          </div>
        </div>
        <nav class="sidebar-nav">
          <div class="nav-section-label">Main</div>
          <a href="dashboard.html" class="nav-link"
            ><svg
              width="16"
              height="16"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
              /></svg
            >Dashboard</a
          >
          <div class="nav-section-label">Inventory</div>
          <a href="products.html" class="nav-link"
            ><svg
              width="16"
              height="16"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"
              /></svg
            >Products</a
          >
          <a href="inventory.html" class="nav-link"
            ><svg
              width="16"
              height="16"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"
              /></svg
            >Inventory</a
          >
          <div class="nav-section-label">Sales</div>
          <a href="customers.html" class="nav-link active"
            ><svg
              width="16"
              height="16"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
              /></svg
            >Customers</a
          >
          <a href="reports.html" class="nav-link"
            ><svg
              width="16"
              height="16"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"
              /></svg
            >Reports</a
          >
        </nav>
        <div class="sidebar-footer">
          <div class="sidebar-user">
            <div class="user-name" id="sidebarUserName">Loading…</div>
            <div class="user-role" id="sidebarUserRole"></div>
          </div>
          <button class="logout-btn" onclick="logout()">
            <svg
              width="15"
              height="15"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
              /></svg
            >Logout
          </button>
        </div>
      </aside>

      <main class="main-content">
        <div class="page-header">
          <div>
            <h1 class="page-title">Customers</h1>
            <p class="page-subtitle">View and manage customers.</p>
          </div>
          <div class="page-header-actions">
            <button
              class="theme-toggle"
              id="themeToggleBtn"
              title="Switch theme"
              aria-label="Switch theme"
            >
              <svg
                id="themeIcon"
                width="16"
                height="16"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
              </svg>
            </button>
            <button class="btn btn-primary" onclick="openAddModal()">
              <svg
                width="16"
                height="16"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M12 4v16m8-8H4"
                />
              </svg>
              Add Customer
            </button>
          </div>
        </div>
        <div id="pageAlert" class="alert hidden"></div>
        <div class="card">
          <div class="card-header">
            <span class="card-title">All Customers</span>
            <div class="search-box search-box-wide">
              <svg
                width="15"
                height="15"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                />
              </svg>
              <input
                type="text"
                id="searchInput"
                placeholder="Search…"
                oninput="filterCustomers()"
                aria-label="Search customers"
              />
            </div>
          </div>
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Phone</th>
                  <th>Email</th>
                  <th>Loyalty Pts</th>
                  <th>Joined</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="customersBody">
                <tr>
                  <td colspan="6" class="table-loading">Loading…</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>

    <!-- Add Modal -->
    <div class="modal-overlay" id="addModal">
      <div class="modal">
        <div class="modal-header">
          <span class="modal-title">Add Customer</span
          ><button class="modal-close" onclick="closeModal('addModal')" aria-label="Close">
            <svg
              width="14"
              height="14"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2.5"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <div id="addAlert" class="alert hidden"></div>
          <div class="form-group">
            <label class="form-label" for="addName">Full Name</label
            ><input type="text" id="addName" class="form-control" />
            <div class="form-error" id="addNameErr"></div>
          </div>
          <div class="grid-2">
            <div class="form-group">
              <label class="form-label" for="addPhone">Phone</label
              ><input type="text" id="addPhone" class="form-control" />
              <div class="form-error" id="addPhoneErr"></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="addEmail">Email</label
              ><input type="email" id="addEmail" class="form-control" />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="addAddress">Address</label
            ><input type="text" id="addAddress" class="form-control" />
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="closeModal('addModal')">
            Cancel</button
          ><button class="btn btn-primary" id="addBtn" onclick="addCustomer()">
            Add Customer
          </button>
        </div>
      </div>
    </div>

    <!-- History Modal -->
    <div class="modal-overlay" id="historyModal">
      <div class="modal modal-lg">
        <div class="modal-header">
          <span class="modal-title" id="historyTitle">Purchase History</span
          ><button class="modal-close" onclick="closeModal('historyModal')" aria-label="Close">
            <svg
              width="14"
              height="14"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2.5"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>
        <div class="modal-body modal-body-no-padding">
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Reference</th>
                  <th>Total</th>
                  <th>Payment</th>
                  <th>Status</th>
                  <th>Date</th>
                </tr>
              </thead>
              <tbody id="historyBody">
                <tr>
                  <td colspan="5" class="table-loading">Loading…</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script>
      let currentUser = null;
      let allCustomers = [];

      window.addEventListener("DOMContentLoaded", async () => {
        initTheme();
        const _ttb = document.getElementById("themeToggleBtn");
        if (_ttb) _ttb.addEventListener("click", toggleTheme);
        currentUser = await requireAuth(["manager"]);
        if (!currentUser) return;
        populateSidebarUser(currentUser);
        loadCustomers();
      });

      async function loadCustomers() {
        document.getElementById("customersBody").innerHTML =
          '<tr><td colspan="6" class="table-loading">Loading…</td></tr>';
        const { data, error } = await db
          .from("customers")
          .select("*")
          .order("created_at", { ascending: false });
        if (error) {
          showAlert("pageAlert", error.message);
          return;
        }
        allCustomers = data || [];
        renderCustomers(allCustomers);
      }

      function renderCustomers(list) {
        const body = document.getElementById("customersBody");
        if (!list.length) {
          body.innerHTML =
            '<tr><td colspan="6" class="table-empty">No customers.</td></tr>';
          return;
        }
        body.innerHTML = list
          .map(
            (c) => `
    <tr>
      <td class="fw-600">${c.name}</td>
      <td class="text-muted">${c.phone || "—"}</td>
      <td class="text-muted">${c.email || "—"}</td>
      <td><span class="badge badge-admin">${c.loyalty_points || 0} pts</span></td>
      <td class="text-muted">${formatDate(c.created_at)}</td>
      <td><div class="action-btns"><button class="btn btn-sm btn-secondary" onclick="viewHistory(${c.id},'${c.name.replace(/'/g, "\\'")}')">History</button></div></td>
    </tr>
  `,
          )
          .join("");
      }

      function filterCustomers() {
        const q = document.getElementById("searchInput").value.toLowerCase();
        renderCustomers(
          allCustomers.filter(
            (c) =>
              (c.name || "").toLowerCase().includes(q) ||
              (c.phone || "").toLowerCase().includes(q),
          ),
        );
      }

      function openAddModal() {
        ["addName", "addPhone", "addEmail", "addAddress"].forEach(
          (id) => (document.getElementById(id).value = ""),
        );
        ["addNameErr", "addPhoneErr"].forEach(
          (id) => (document.getElementById(id).textContent = ""),
        );
        hideAlert("addAlert");
        openModal("addModal");
      }

      async function addCustomer() {
        hideAlert("addAlert");
        const name = document.getElementById("addName").value.trim(),
          phone = document.getElementById("addPhone").value.trim(),
          email = document.getElementById("addEmail").value.trim() || null,
          address = document.getElementById("addAddress").value.trim() || null;
        let valid = true;
        if (!name) {
          document.getElementById("addNameErr").textContent = "Required.";
          valid = false;
        }
        if (!phone) {
          document.getElementById("addPhoneErr").textContent = "Required.";
          valid = false;
        }
        if (!valid) return;
        const btn = document.getElementById("addBtn");
        btn.disabled = true;
        btn.textContent = "Saving…";
        try {
          const { error } = await db
            .from("customers")
            .insert({ name, phone, email, address });
          if (error) throw error;
          closeModal("addModal");
          showAlert("pageAlert", "Customer added.", "success");
          loadCustomers();
        } catch (err) {
          showAlert("addAlert", err.message);
        } finally {
          btn.disabled = false;
          btn.textContent = "Add Customer";
        }
      }

      async function viewHistory(custId, custName) {
        document.getElementById("historyTitle").textContent =
          custName + " — Purchase History";
        document.getElementById("historyBody").innerHTML =
          '<tr><td colspan="5" class="table-loading">Loading…</td></tr>';
        openModal("historyModal");
        const { data } = await db
          .from("sales")
          .select("sale_ref,total,payment_method,payment_status,created_at")
          .eq("customer_id", custId)
          .order("created_at", { ascending: false });
        if (!data?.length) {
          document.getElementById("historyBody").innerHTML =
            '<tr><td colspan="5" class="table-empty">No purchases.</td></tr>';
          return;
        }
        document.getElementById("historyBody").innerHTML = data
          .map(
            (s) =>
              `<tr><td class="fw-600">${s.sale_ref}</td><td>${formatCurrency(s.total)}</td><td><span class="badge badge-${s.payment_method}">${s.payment_method?.replace("_", " ")}</span></td><td><span class="badge badge-${s.payment_status}">${s.payment_status}</span></td><td class="text-muted">${formatDate(s.created_at)}</td></tr>`,
          )
          .join("");
      }
    </script>
  </body>
</html>
